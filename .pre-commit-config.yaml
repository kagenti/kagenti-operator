repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ['--maxkb=1024']
        exclude: ^operator/bin/
      - id: check-yaml
        args: ['--allow-multiple-documents']
        # Exclude Helm templates as they contain Go template syntax
        exclude: ^charts/.*/templates/.*\.yaml$
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.23
    hooks:
      - id: helmlint
        files: ^charts/

  # Rewrite AI Co-authored-by trailers to Assisted-By
  - repo: local
    hooks:
      - id: ai-assisted-by-trailer
        name: Replace Co-Authored-By with Assisted-By
        entry: scripts/hooks/commit-msg
        language: script
        stages: [commit-msg]

  - repo: local
    hooks:
      # Rossoctl Operator hooks
      - id: go-fmt
        name: go-fmt
        entry: bash -c 'cd rossoctl-operator && go fmt ./...'
        language: system
        files: ^operator/.*\.go$
        pass_filenames: false
      - id: go-vet
        name: go-vet
        entry: bash -c 'cd rossoctl-operator && go vet ./...'
        language: system
        files: ^operator/.*\.go$
        pass_filenames: false
      - id: go-mod-tidy
        name: go-mod-tidy
        entry: bash -c 'cd rossoctl-operator && go mod tidy'
        language: system
        files: ^operator/(go\.mod|go\.sum)$
        pass_filenames: false

      # Kubernetes YAML validation
      - id: k8s-yaml-validate
        name: validate k8s yamls
        entry: bash -c 'find operator/config -name "*.yaml" -not -path "*/samples/*" -exec kubectl --dry-run=client apply -f {} \;'
        language: system
        files: ^operator/config/.*\.yaml$
        pass_filenames: false
