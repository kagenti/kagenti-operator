# Basic AgentRuntime: enroll a Deployment as an agent with default configuration.
# The controller applies rossoctl.io/type label and triggers sidecar injection.
# Configuration settings come from cluster and namespace defaults.
# Note: The target Deployment should have a protocol.rossoctl.io/a2a label
# for automatic AgentCard creation and agent discovery.
apiVersion: agent.rossoctl.dev/v1alpha1
kind: AgentRuntime
metadata:
  name: weather-agent-runtime
  namespace: default
  labels:
    app.kubernetes.io/name: weather-agent
spec:
  type: agent
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: weather-agent
