# AuthBridge runtime configuration template.
# The operator copies this to agent namespaces via ensureNamespaceConfigMaps.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authbridge-runtime-config
  namespace: rossoctl-operator-system
  labels:
    app.kubernetes.io/name: rossoctl-operator
    app.kubernetes.io/component: authbridge
    app.kubernetes.io/managed-by: kustomize
data:
  config.yaml: |
    spiffe: {}
    pipeline:
      inbound:
        plugins:
          - name: jwt-validation
            config:
              issuer: "http://keycloak.localtest.me:8080/realms/rossoctl"
              keycloak_url: "http://keycloak-service.keycloak.svc:8080"
              keycloak_realm: "rossoctl"
      outbound:
        plugins:
          - name: token-exchange
            config:
              keycloak_url: "http://keycloak-service.keycloak.svc:8080"
              keycloak_realm: "rossoctl"
              default_policy: "passthrough"
              identity:
                type: "client-secret"
